<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasirku - Belanja di Toko Terdekat</title>
    <link rel="manifest" href="manifest-customer.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon-customer-512.png">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Leaflet CSS & JS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase SDK v9 Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        #map { height: 220px; width: 100%; border-radius: 1rem; z-index: 10; }
    </style>
</head>
<body class="bg-slate-50 text-slate-950 antialiased min-h-screen pb-20" x-data="customerApp()">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3.5 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-brand-600 flex items-center justify-center text-white shadow-md font-black overflow-hidden border">
                    <template x-if="tokoAktif && tokoAktif.logoImg">
                        <img :src="tokoAktif.logoImg" class="w-full h-full object-cover">
                    </template>
                    <template x-if="!tokoAktif || !tokoAktif.logoImg">
                        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    </template>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight text-slate-900" x-text="tokoAktif ? tokoAktif.nama : 'Kasirku Pelanggan'"></h1>
                    <p class="text-[11px] text-slate-500 font-medium" x-text="isLoggedIn ? ('Halo, ' + customerNoHp) : 'Login Kata Sandi'"></p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <!-- TOMBOL RIWAYAT PEMBELIAN -->
                <button x-show="isLoggedIn" @click="bukaRiwayatModal()" class="p-2.5 bg-amber-50 text-amber-700 border border-amber-200 rounded-xl font-bold flex items-center gap-1" title="Riwayat Pembelian">
                    <i data-lucide="receipt" class="w-5 h-5"></i>
                </button>
                <button x-show="isLoggedIn && step !== 'pilih_toko'" @click="bukaLiveChatModal()" class="relative p-2.5 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-xl font-bold flex items-center gap-1.5" title="Live Chat Toko">
                    <i data-lucide="message-square" class="w-5 h-5"></i>
                </button>
                <button x-show="isLoggedIn" @click="bukaKeranjangModal()" class="relative p-2.5 bg-brand-50 text-brand-600 rounded-xl font-bold flex items-center gap-1.5">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span x-show="keranjang.length > 0" class="absolute -top-1.5 -right-1.5 bg-rose-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-black" x-text="keranjang.length"></span>
                </button>
                <button x-show="isLoggedIn" @click="logout()" class="p-2.5 bg-rose-50 text-rose-600 rounded-xl font-bold" title="Keluar">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Notifikasi Floating -->
        <template x-if="notification.show">
            <div :class="notification.type === 'success' ? 'bg-slate-900 text-white' : 'bg-rose-600 text-white'" 
                 class="fixed top-20 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-sm text-sm font-semibold px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between">
                <span x-text="notification.message"></span>
                <button @click="notification.show = false"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
        </template>

        <div id="recaptcha-container"></div>

        <!-- ================= LOGIN & DAFTAR ================= -->
        <template x-if="!isLoggedIn">
            <div class="min-h-[80vh] flex items-center justify-center">
                <div class="bg-white border rounded-3xl p-6 w-full space-y-5 shadow-lg">
                    <div class="text-center space-y-2">
                        <div class="w-14 h-14 bg-brand-600 text-white rounded-2xl mx-auto flex items-center justify-center shadow-md">
                            <i data-lucide="lock" class="w-7 h-7"></i>
                        </div>
                        <h2 class="font-black text-2xl text-slate-900" x-text="authMode === 'login' ? 'Masuk Aplikasi' : 'Daftar Akun Baru'"></h2>
                        <p class="text-xs text-slate-500" x-text="authMode === 'login' ? 'Masukkan nomor HP dan kata sandi Anda.' : 'Verifikasi nomor HP via SMS untuk membuat kata sandi.'"></p>
                    </div>

                    <!-- MODE LOGIN -->
                    <template x-if="authMode === 'login'">
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs font-bold text-slate-600 uppercase">Nomor HP / WhatsApp</label>
                                <input type="text" x-model="loginNoHp" placeholder="Contoh: 08123456789" class="w-full mt-1 bg-slate-50 border rounded-xl px-3.5 py-3.5 text-sm font-bold focus:outline-none focus:border-brand-600">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-600 uppercase">Kata Sandi</label>
                                <input type="password" x-model="loginPassword" placeholder="••••••••" class="w-full mt-1 bg-slate-50 border rounded-xl px-3.5 py-3.5 text-sm font-bold focus:outline-none focus:border-brand-600">
                            </div>
                            <button @click="prosesLogin()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3.5 rounded-xl text-sm shadow-lg">
                                Masuk
                            </button>
                            <div class="text-center pt-2">
                                <button @click="authMode = 'daftar_step1'" class="text-xs text-brand-600 font-bold hover:underline">Belum punya akun? Daftar di sini</button>
                            </div>
                        </div>
                    </template>

                    <!-- DAFTAR STEP 1 -->
                    <template x-if="authMode === 'daftar_step1'">
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs font-bold text-slate-600 uppercase">Nomor HP Aktif</label>
                                <input type="text" x-model="inputNoHp" placeholder="Contoh: 08123456789" class="w-full mt-1 bg-slate-50 border rounded-xl px-3.5 py-3.5 text-sm font-bold focus:outline-none focus:border-brand-600">
                            </div>
                            <button @click="kirimSmsOtp()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3.5 rounded-xl text-sm shadow-lg">
                                Kirim Kode OTP via SMS
                            </button>
                            <div class="text-center pt-2">
                                <button @click="authMode = 'login'" class="text-xs text-slate-500 font-bold hover:underline">Sudah punya akun? Masuk</button>
                            </div>
                        </div>
                    </template>

                    <!-- DAFTAR STEP 2 -->
                    <template x-if="authMode === 'daftar_step2'">
                        <div class="space-y-3">
                            <div class="bg-blue-50 p-3 rounded-xl text-xs text-blue-800 text-center font-medium">
                                📩 SMS OTP dikirim ke: <strong x-text="inputNoHp"></strong>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-600 uppercase">Masukkan 6 Digit Kode SMS</label>
                                <input type="text" x-model="inputKodeOtp" maxlength="6" placeholder="123456" class="w-full mt-1 bg-slate-50 border rounded-xl px-3.5 py-3.5 text-center tracking-widest text-lg font-black focus:outline-none focus:border-brand-600">
                            </div>
                            <button @click="verifikasiSmsOtpDaftar()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl text-sm shadow-lg">
                                Verifikasi SMS OTP
                            </button>
                        </div>
                    </template>

                    <!-- DAFTAR STEP 3 -->
                    <template x-if="authMode === 'daftar_step3'">
                        <div class="space-y-3">
                            <div class="bg-emerald-50 p-3 rounded-xl text-xs text-emerald-800 text-center font-medium">
                                ✅ SMS OTP Terverifikasi! Silakan buat kata sandi akun Anda.
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-600 uppercase">Buat Kata Sandi Baru</label>
                                <input type="password" x-model="newPassword" placeholder="Minimal 6 karakter" class="w-full mt-1 bg-slate-50 border rounded-xl px-3.5 py-3.5 text-sm font-bold focus:outline-none focus:border-brand-600">
                            </div>
                            <button @click="simpanPendaftaran()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3.5 rounded-xl text-sm shadow-lg">
                                Selesaikan Pendaftaran & Masuk
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- ================= APLIKASI UTAMA ================= -->
        <template x-if="isLoggedIn">
            <div class="space-y-4">

                <!-- TAMPILAN 1: PILIH TOKO TERDEKAT -->
                <template x-if="step === 'pilih_toko'">
                    <div class="space-y-4">
                        <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl space-y-2">
                            <div class="flex items-center gap-2 text-blue-900 font-bold text-sm">
                                <i data-lucide="map-pin" class="w-5 h-5 text-brand-600"></i>
                                <span>Lokasi Anda & Deteksi Toko</span>
                            </div>
                            <p class="text-xs text-blue-700 leading-relaxed">Sistem menampilkan toko dalam radius maksimal **2 Kilometer** dari posisi Anda.</p>
                            <button @click="deteksiLokasiSaya()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md">
                                <i data-lucide="locate" class="w-4 h-4"></i> Segarkan / Deteksi GPS HP Saya
                            </button>
                        </div>

                        <h2 class="font-black text-sm uppercase tracking-wider text-slate-500">Daftar Toko Sekitar (Maks 2 KM)</h2>

                        <div class="space-y-3">
                            <template x-for="toko in daftarToko" :key="toko.kode">
                                <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between gap-3">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-12 h-12 rounded-xl bg-slate-100 overflow-hidden border flex-shrink-0 flex items-center justify-center">
                                            <template x-if="toko.logoImg"><img :src="toko.logoImg" class="w-full h-full object-cover"></template>
                                            <template x-if="!toko.logoImg"><i data-lucide="store" class="w-6 h-6 text-slate-400"></i></template>
                                        </div>
                                        <div class="space-y-0.5">
                                            <div class="flex items-center gap-1.5">
                                                <h3 class="font-extrabold text-base text-slate-900" x-text="toko.nama"></h3>
                                                <span class="text-[9px] px-1.5 py-0.5 rounded font-bold" :class="toko.isBuka ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'" x-text="toko.isBuka ? 'BUKA' : 'TUTUP'"></span>
                                                <span class="text-[10px] bg-brand-50 text-brand-700 px-2 py-0.5 rounded-md font-bold" x-text="toko.jarakKm + ' KM'"></span>
                                            </div>
                                            <p class="text-xs text-slate-500 line-clamp-1" x-text="toko.alamat"></p>
                                            <p class="text-[11px] text-brand-600 font-bold" x-text="'Telp/WA: ' + toko.telp"></p>
                                        </div>
                                    </div>
                                    <button @click="pilihTokoIni(toko)" :disabled="toko.jarakKm > 2.0 || !toko.isBuka" 
                                            :class="(toko.jarakKm > 2.0 || !toko.isBuka) ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-brand-600 hover:bg-brand-700 text-white shadow-md active:scale-95'" 
                                            class="px-3.5 py-2.5 rounded-xl text-xs font-extrabold transition whitespace-nowrap">
                                        <span x-text="!toko.isBuka ? 'Toko Tutup' : (toko.jarakKm > 2.0 ? '>2 KM' : 'Kunjungi')"></span>
                                    </button>
                                </div>
                            </template>
                            <template x-if="daftarToko.length === 0">
                                <div class="text-center py-10 bg-white border rounded-2xl p-6">
                                    <i data-lucide="store" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                                    <p class="text-sm font-bold text-slate-600">Tidak ada toko ditemukan di sekitar Anda.</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- TAMPILAN 2: KATALOG PRODUK -->
                <template x-if="step === 'katalog'">
                    <div class="space-y-4">
                        <div class="bg-amber-50 border border-amber-300 p-3.5 rounded-2xl flex items-start gap-3 shadow-sm">
                            <i data-lucide="message-square-warning" class="w-6 h-6 text-amber-600 flex-shrink-0 mt-0.5"></i>
                            <div class="space-y-1 text-xs text-amber-900 font-medium">
                                <p class="font-extrabold uppercase">⚠️ Perhatian Sebelum Membeli:</p>
                                <p>Wajib chat terlebih dahulu dengan toko melalui tombol <span class="bg-indigo-100 text-indigo-800 font-bold px-1.5 py-0.5 rounded">Chat</span> di atas untuk memastikan apakah pesanan Anda bisa dilayani antar atau tidak.</p>
                            </div>
                        </div>

                        <div class="bg-white border p-4 rounded-2xl shadow-sm flex justify-between items-center">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 rounded-xl bg-slate-100 overflow-hidden border flex-shrink-0 flex items-center justify-center">
                                    <template x-if="tokoAktif.logoImg"><img :src="tokoAktif.logoImg" class="w-full h-full object-cover"></template>
                                    <template x-if="!tokoAktif.logoImg"><i data-lucide="store" class="w-6 h-6 text-slate-400"></i></template>
                                </div>
                                <div>
                                    <span class="text-[10px] font-extrabold bg-brand-50 text-brand-700 px-2 py-0.5 rounded">Toko Pilihan</span>
                                    <h2 class="font-black text-base text-slate-900 mt-0.5" x-text="tokoAktif.nama"></h2>
                                    <p class="text-xs text-slate-500" x-text="tokoAktif.alamat"></p>
                                </div>
                            </div>
                            <button @click="step = 'pilih_toko'; keranjang = []" class="text-xs text-rose-600 font-bold bg-rose-50 px-3 py-2 rounded-xl border border-rose-200">Ganti Toko</button>
                        </div>

                        <div class="relative">
                            <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" x-model="searchProduk" placeholder="Cari barang di toko ini..." class="w-full bg-white border border-slate-300 rounded-2xl pl-11 pr-4 py-3 text-sm font-medium focus:outline-none focus:border-brand-600 shadow-sm">
                        </div>

                        <div class="grid grid-cols-2 gap-2.5 max-h-[480px] overflow-y-auto pr-1">
                            <template x-for="item in filteredProduk" :key="item.id">
                                <div @click="tambahKeKeranjang(item)" class="bg-white border border-slate-200 p-3 rounded-2xl flex flex-col justify-between shadow-sm cursor-pointer hover:border-brand-500 active:scale-95 transition">
                                    <div>
                                        <div class="w-full h-24 bg-slate-100 rounded-xl mb-2 overflow-hidden flex items-center justify-center border">
                                            <template x-if="item.gambar"><img :src="item.gambar" class="w-full h-full object-cover"></template>
                                            <template x-if="!item.gambar"><i data-lucide="image" class="w-6 h-6 text-slate-300"></i></template>
                                        </div>
                                        <span class="text-[9px] font-bold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded" x-text="item.kategori"></span>
                                        <h4 class="font-bold text-slate-900 text-xs mt-1 line-clamp-2" x-text="item.nama"></h4>
                                    </div>
                                    <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
                                        <span class="text-xs font-black text-brand-600" x-text="formatRupiah(item.jual)"></span>
                                        <span class="bg-brand-50 text-brand-700 text-[10px] font-bold px-2 py-1 rounded-lg">+ Beli</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- TAMPILAN 3: CHECKOUT & GOOGLE MAPS DENGAN AKURASI GPS AKURAT -->
                <template x-if="step === 'checkout'">
                    <div class="space-y-4">
                        <div class="bg-white border p-4 rounded-2xl shadow-sm space-y-3">
                            <div class="flex justify-between items-center">
                                <h2 class="font-black text-sm text-slate-900 uppercase tracking-wider flex items-center gap-2">
                                    <i data-lucide="map-pin" class="w-5 h-5 text-brand-600"></i> Lokasi Pengiriman
                                </h2>
                                <button @click="mintaIzinGpsHp()" class="text-[11px] bg-brand-50 text-brand-700 font-bold px-3 py-1.5 rounded-xl border border-brand-200 flex items-center gap-1">
                                    <i data-lucide="crosshair" class="w-3.5 h-3.5"></i> Update GPS HP
                                </button>
                            </div>
                            <p class="text-xs text-slate-500">Peta otomatis membaca lokasi HP Anda. Jika tidak pas, klik 'Update GPS HP' atau geser pin merah.</p>
                            <div id="map"></div>
                            <div class="space-y-2 pt-2">
                                <label class="text-xs font-bold text-slate-600 uppercase">Nama Penerima & No HP</label>
                                <input type="text" x-model="checkoutForm.nama" placeholder="Nama Anda" class="w-full bg-slate-50 border rounded-xl px-3.5 py-2.5 text-sm font-medium">
                                <input type="text" x-model="checkoutForm.telp" placeholder="No HP" class="w-full bg-slate-50 border rounded-xl px-3.5 py-2.5 text-sm font-medium">
                                <label class="text-xs font-bold text-slate-600 uppercase">Detail Patokan Alamat Rumah</label>
                                <textarea x-model="checkoutForm.alamat" rows="2" placeholder="Contoh: Rumah pagar hitam" class="w-full bg-slate-50 border rounded-xl px-3.5 py-2.5 text-sm font-medium"></textarea>
                            </div>
                        </div>

                        <div class="bg-white border p-4 rounded-2xl shadow-sm space-y-3">
                            <h2 class="font-black text-sm text-slate-900 uppercase tracking-wider">Ringkasan Pembayaran</h2>
                            <div class="space-y-2 text-xs divide-y">
                                <template x-for="c in keranjang">
                                    <div class="pt-2 flex justify-between">
                                        <span class="font-medium" x-text="c.nama + ' (' + c.qty + 'x)'"></span>
                                        <span class="font-bold" x-text="formatRupiah(c.jual * c.qty)"></span>
                                    </div>
                                </template>
                            </div>
                            <div class="border-t pt-2 space-y-1.5 text-xs">
                                <div class="flex justify-between text-slate-600"><span>Total Belanja</span><span class="font-bold" x-text="formatRupiah(totalBelanja())"></span></div>
                                <div class="flex justify-between text-slate-600">
                                    <span>Ongkos Kirim (<span x-text="jarakPemesananKM + ' KM'"></span>)</span>
                                    <span class="font-bold" x-text="formatRupiah(ongkir())"></span>
                                </div>
                                <div class="flex justify-between text-sm font-black text-brand-600 pt-1 border-t"><span>TOTAL TAGIHAN</span><span x-text="formatRupiah(totalBelanja() + ongkir())"></span></div>
                            </div>
                        </div>

                        <div class="bg-white border p-4 rounded-2xl shadow-sm space-y-3 text-center">
                            <h2 class="font-black text-sm text-slate-900 uppercase tracking-wider">Pembayaran Non-COD (Transfer Bank / QRIS)</h2>
                            <div class="bg-blue-50 border border-blue-200 p-3.5 rounded-xl text-left space-y-1">
                                <p class="text-xs font-bold text-blue-900 uppercase">Silakan transfer pembayaran ke:</p>
                                <p class="text-xs text-blue-800">🏦 <strong>Rekening Resmi Toko</strong></p>
                                <p class="text-xs font-mono font-bold text-slate-800" x-text="tokoAktif.rekening || 'Hubungi Toko via Chat'"></p>
                                <p class="text-[11px] text-slate-500">Atau scan QRIS toko di bawah ini:</p>
                            </div>

                            <template x-if="tokoAktif.qrisImg">
                                <img :src="tokoAktif.qrisImg" class="w-48 h-48 mx-auto object-contain border p-2 rounded-xl bg-slate-50 shadow-sm">
                            </template>

                            <div class="space-y-1.5 pt-2 text-left">
                                <label class="text-xs font-bold text-slate-600 uppercase">Upload Bukti Transfer Pembayaran (Wajib)</label>
                                <input type="file" accept="image/*" @change="handleBuktiUpload($event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-brand-50 file:text-brand-700">
                                <div x-show="checkoutForm.buktiImg" class="mt-2">
                                    <img :src="checkoutForm.buktiImg" class="w-20 h-20 object-cover rounded-xl border">
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <button @click="step = 'katalog'" class="w-1/3 bg-slate-100 text-slate-700 font-bold py-3.5 rounded-xl text-xs">Kembali</button>
                            <button @click="kirimPesanan()" class="w-2/3 bg-brand-600 hover:bg-brand-700 text-white font-extrabold py-3.5 rounded-xl text-xs shadow-lg">Kirim Pesanan Sekarang</button>
                        </div>

    <!-- SCRIPT UTAMA -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCuoBATHeQBLEx1fCzg8n4XkOGdR-N9yg0",
            authDomain: "warung-online-10009.firebaseapp.com",
            projectId: "warung-online-10009",
            storageBucket: "warung-online-10009.firebasestorage.app",
            messagingSenderId: "757248268177",
            appId: "1:757248268177:web:f3de9a4f8703dbc9ffec30"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function customerApp() {
            return {
                isLoggedIn: localStorage.getItem('customer_login') === 'true',
                customerNoHp: localStorage.getItem('customer_nohp') || '',
                
                authMode: 'login',
                loginNoHp: '',
                loginPassword: '',
                
                inputNoHp: '',
                inputKodeOtp: '',
                newPassword: '',
                confirmationResult: null,

                step: 'pilih_toko',
                daftarToko: [],
                tokoAktif: null,
                produkList: [],
                searchProduk: '',
                keranjang: [],
                riwayatList: [],
                showKeranjangModal: false,
                showChatModal: false,
                showRiwayatModal: false,
                chatMessages: [],
                inputChatText: '',
                lastOrderId: null,
                notification: { show: false, message: '', type: 'success' },
                
                posisiUser: { lat: -6.200000, lng: 106.816666 },
                jarakPemesananKM: 0,
                mapInstance: null,
                markerInstance: null,

                checkoutForm: {
                    nama: '',
                    telp: '',
                    alamat: '',
                    lat: 0,
                    lng: 0,
                    buktiImg: ''
                },

                init() {
                    this.$nextTick(() => { 
                        lucide.createIcons(); 
                        this.inisialisasiRecaptcha();
                    });
                    if (this.isLoggedIn) {
                        this.deteksiLokasiSaya();
                        this.checkoutForm.telp = this.customerNoHp;
                    }
                },

                showNotification(message, type = 'success') {
                    this.notification = { show: true, message, type };
                    setTimeout(() => { this.notification.show = false; }, 3000);
                },

                formatRupiah(val) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);
                },

                inisialisasiRecaptcha() {
                    try {
                        if (!window.recaptchaVerifier) {
                            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
                        }
                    } catch(e) {}
                },

                async prosesLogin() {
                    if (!this.loginNoHp || !this.loginPassword) {
                        this.showNotification('Nomor HP dan kata sandi wajib diisi!', 'error');
                        return;
                    }

                    let formattedHp = this.loginNoHp.trim();
                    if (formattedHp.startsWith('0')) formattedHp = '+62' + formattedHp.slice(1);
                    else if (!formattedHp.startsWith('+')) formattedHp = '+' + formattedHp;

                    try {
                        const docRef = await db.collection('kasirku_customers').doc(formattedHp).get();
                        if (!docRef.exists) {
                            this.showNotification('Nomor HP belum terdaftar. Silakan daftar!', 'error');
                            return;
                        }

                        const dataUser = docRef.data();
                        if (dataUser.password === this.loginPassword) {
                            localStorage.setItem('customer_login', 'true');
                            localStorage.setItem('customer_nohp', formattedHp);
                            this.isLoggedIn = true;
                            this.customerNoHp = formattedHp;
                            this.checkoutForm.telp = formattedHp;
                            this.deteksiLokasiSaya();
                            this.showNotification('Login Berhasil!');
                            this.$nextTick(() => { lucide.createIcons(); });
                        } else {
                            this.showNotification('Kata sandi salah!', 'error');
                        }
                    } catch (e) {
                        this.showNotification('Kesalahan sistem database.', 'error');
                    }
                },

                async kirimSmsOtp() {
                    if (!this.inputNoHp || this.inputNoHp.length < 10) {
                        this.showNotification('Masukkan nomor HP yang valid!', 'error');
                        return;
                    }

                    let formattedHp = this.inputNoHp.trim();
                    if (formattedHp.startsWith('0')) formattedHp = '+62' + formattedHp.slice(1);
                    else if (!formattedHp.startsWith('+')) formattedHp = '+' + formattedHp;

                    try {
                        const checkDoc = await db.collection('kasirku_customers').doc(formattedHp).get();
                        if (checkDoc.exists) {
                            this.showNotification('Nomor sudah terdaftar! Silakan langsung login.', 'error');
                            this.authMode = 'login';
                            return;
                        }

                        this.showNotification('Mengirim SMS OTP...');
                        const appVerifier = window.recaptchaVerifier;
                        const confirmationResult = await auth.signInWithPhoneNumber(formattedHp, appVerifier);
                        this.confirmationResult = confirmationResult;
                        this.authMode = 'daftar_step2';
                        this.showNotification('Kode SMS OTP berhasil dikirim!');
                    } catch (error) {
                        this.showNotification('Gagal kirim SMS: ' + error.message, 'error');
                        if (window.recaptchaVerifier) window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
                    }
                },

                async verifikasiSmsOtpDaftar() {
                    if (!this.inputKodeOtp || this.inputKodeOtp.length !== 6) {
                        this.showNotification('Masukkan 6 digit kode SMS dengan benar!', 'error');
                        return;
                    }

                    try {
                        this.showNotification('Memverifikasi kode...');
                        await this.confirmationResult.confirm(this.inputKodeOtp);
                        this.authMode = 'daftar_step3';
                        this.showNotification('SMS OTP Terverifikasi! Silakan buat sandi.');
                    } catch (error) {
                        this.showNotification('Kode OTP SMS salah atau kedaluwarsa!', 'error');
                    }
                },

                async simpanPendaftaran() {
                    if (!this.newPassword || this.newPassword.length < 6) {
                        this.showNotification('Kata sandi minimal 6 karakter!', 'error');
                        return;
                    }

                    let formattedHp = this.inputNoHp.trim();
                    if (formattedHp.startsWith('0')) formattedHp = '+62' + formattedHp.slice(1);
                    else if (!formattedHp.startsWith('+')) formattedHp = '+' + formattedHp;

                    try {
                        await db.collection('kasirku_customers').doc(formattedHp).set({
                            nohp: formattedHp,
                            password: this.newPassword,
                            createdAt: Date.now()
                        });

                        localStorage.setItem('customer_login', 'true');
                        localStorage.setItem('customer_nohp', formattedHp);
                        this.isLoggedIn = true;
                        this.customerNoHp = formattedHp;
                        this.checkoutForm.telp = formattedHp;
                        this.deteksiLokasiSaya();
                        this.showNotification('Pendaftaran Akun Berhasil!');
                        this.$nextTick(() => { lucide.createIcons(); });
                    } catch (e) {
                        this.showNotification('Gagal menyimpan data akun ke server.', 'error');
                    }
                },

                logout() {
                    localStorage.removeItem('customer_login');
                    localStorage.removeItem('customer_nohp');
                    this.isLoggedIn = false;
                    this.authMode = 'login';
                    this.loginNoHp = '';
                    this.loginPassword = '';
                    this.showNotification('Berhasil keluar akun');
                },

                hitungJarakKM(lat1, lon1, lat2, lon2) {
                    const R = 6371;
                    const dLat = (lat2 - lat1) * Math.PI / 180;
                    const dLon = (lon2 - lon1) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                              Math.sin(dLon/2) * Math.sin(dLon/2);
                    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
                },

                mintaIzinGpsHp() {
                    if (navigator.geolocation) {
                        this.showNotification('Membaca sensor GPS HP...');
                        navigator.geolocation.getCurrentPosition(
                            (pos) => {
                                this.posisiUser.lat = pos.coords.latitude;
                                this.posisiUser.lng = pos.coords.longitude;
                                if (this.mapInstance && this.markerInstance) {
                                    this.mapInstance.setView([this.posisiUser.lat, this.posisiUser.lng], 16);
                                    this.markerInstance.setLatLng([this.posisiUser.lat, this.posisiUser.lng]);
                                    this.checkoutForm.lat = this.posisiUser.lat;
                                    this.checkoutForm.lng = this.posisiUser.lng;
                                    if (this.tokoAktif) {
                                        this.jarakPemesananKM = Number(this.hitungJarakKM(this.tokoAktif.lat, this.tokoAktif.lng, this.posisiUser.lat, this.posisiUser.lng).toFixed(2));
                                    }
                                }
                                this.showNotification('✅ GPS HP Berhasil Terdeteksi!');
                            },
                            (err) => {
                                this.showNotification('Pastikan Izin Lokasi GPS di HP diaktifkan!', 'error');
                            },
                            { enableHighAccuracy: true, timeout: 15000 }
                        );
                    }
                },

                deteksiLokasiSaya() {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                this.posisiUser.lat = position.coords.latitude;
                                this.posisiUser.lng = position.coords.longitude;
                                this.muatDaftarToko();
                            },
                            () => { this.muatDaftarToko(); },
                            { enableHighAccuracy: true, timeout: 10000 }
                        );
                    } else {
                        this.muatDaftarToko();
                    }
                },

                async muatDaftarToko() {
                    try {
                        const snap = await db.collection('kasirku_toko').get();
                        let tempToko = [];
                        snap.forEach(doc => {
                            const data = doc.data();
                            const prof = data.profilToko || {};
                            const tLat = prof.lat || (this.posisiUser.lat + 0.002);
                            const tLng = prof.lng || (this.posisiUser.lng + 0.002);
                            const jarak = this.hitungJarakKM(this.posisiUser.lat, this.posisiUser.lng, tLat, tLng);

                            tempToko.push({
                                kode: doc.id,
                                nama: prof.nama || doc.id,
                                alamat: prof.alamat || 'Alamat Toko',
                                telp: prof.telp || '-',
                                rekening: prof.rekening || '',
                                qrisImg: prof.qrisImg || '',
                                logoImg: prof.logoImg || '',
                                isBuka: prof.isBuka !== undefined ? prof.isBuka : true,
                                lat: tLat,
                                lng: tLng,
                                jarakKm: Number(jarak.toFixed(2))
                            });
                        });
                        tempToko.sort((a, b) => a.jarakKm - b.jarakKm);
                        this.daftarToko = tempToko;
                    } catch (e) {}
                },

                async pilihTokoIni(toko) {
                    if (!toko.isBuka) {
                        this.showNotification('Maaf, toko sedang TUTUP.', 'error');
                        return;
                    }
                    if (toko.jarakKm > 2.0) {
                        this.showNotification('Jarak toko lebih dari 2 KM (Maksimal pengantaran 2 KM).', 'error');
                        return;
                    }
                    this.tokoAktif = toko;
                    this.checkoutForm.lat = this.posisiUser.lat;
                    this.checkoutForm.lng = this.posisiUser.lng;

                    try {
                        const prodSnap = await db.collection('kasirku_toko').doc(toko.kode).collection('produk').get();
                        let pList = [];
                        prodSnap.forEach(d => pList.push({ id: d.id, ...d.data() }));
                        this.produkList = pList;
                        this.step = 'katalog';
                    } catch (e) {
                        this.showNotification('Gagal memuat produk', 'error');
                    }
                },

                get filteredProduk() {
                    if (!this.searchProduk) return this.produkList;
                    const q = this.searchProduk.toLowerCase();
                    return this.produkList.filter(p => p.nama.toLowerCase().includes(q) || p.kategori.toLowerCase().includes(q));
                },

                tambahKeKeranjang(item) {
                    const exist = this.keranjang.find(c => c.id === item.id);
                    if (exist) {
                        if (exist.qty < item.stok) exist.qty++;
                        else this.showNotification('Stok habis!', 'error');
                    } else {
                        this.keranjang.push({ ...item, qty: 1 });
                        this.showNotification('Ditambahkan ke keranjang');
                    }
                },

                totalBelanja() { return this.keranjang.reduce((acc, c) => acc + (c.jual * c.qty), 0); },
                
                ongkir() {
                    const j = this.jarakPemesananKM;
                    if (j <= 1.0) return 20000;
                    return 30000;
                },

                bukaKeranjangModal() {
                    if (this.keranjang.length === 0) { this.showNotification('Keranjang kosong', 'error'); return; }
                    this.showKeranjangModal = true;
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                async bukaRiwayatModal() {
                    this.showRiwayatModal = true;
                    this.$nextTick(() => { lucide.createIcons(); });
                    try {
                        let rList = [];
                        for (let toko of this.daftarToko) {
                            const snap = await db.collection('kasirku_toko').doc(toko.kode).collection('transaksi').get();
                            snap.forEach(doc => {
                                const d = doc.data();
                                if (d.customer && d.customer.telp === this.customerNoHp) {
                                    rList.push({ ...d, tokoNama: toko.nama });
                                }
                            });
                        }
                        rList.sort((a, b) => b.timestamp - a.timestamp);
                        this.riwayatList = rList;
                    } catch(e){}
                },

                lanjutKeCheckout() {
                    this.showKeranjangModal = false;
                    this.step = 'checkout';
                    setTimeout(() => { this.inisialisasiPeta(); }, 300);
                },

                inisialisasiPeta() {
                    if (this.mapInstance) this.mapInstance.remove();
                    this.mapInstance = L.map('map').setView([this.posisiUser.lat, this.posisiUser.lng], 16);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(this.mapInstance);
                    
                    this.markerInstance = L.marker([this.posisiUser.lat, this.posisiUser.lng], { draggable: true }).addTo(this.mapInstance);
                    
                    this.checkoutForm.lat = this.posisiUser.lat;
                    this.checkoutForm.lng = this.posisiUser.lng;
                    this.jarakPemesananKM = Number(this.hitungJarakKM(this.tokoAktif.lat, this.tokoAktif.lng, this.posisiUser.lat, this.posisiUser.lng).toFixed(2));

                    this.markerInstance.on('dragend', (e) => {
                        const c = e.target.getLatLng();
                        this.checkoutForm.lat = c.lat;
                        this.checkoutForm.lng = c.lng;
                        this.jarakPemesananKM = Number(this.hitungJarakKM(this.tokoAktif.lat, this.tokoAktif.lng, c.lat, c.lng).toFixed(2));
                    });

                    // Otomatis minta izin lokasi GPS akurasi tinggi
                    this.mintaIzinGpsHp();
                },

                handleBuktiUpload(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => { this.checkoutForm.buktiImg = ev.target.result; };
                        reader.readAsDataURL(file);
                    }
                },

                async kirimPesanan() {
                    if (!this.checkoutForm.nama || !this.checkoutForm.telp || !this.checkoutForm.alamat || !this.checkoutForm.buktiImg) {
                        this.showNotification('Lengkapi nama, telp, alamat, dan bukti transfer!', 'error');
                        return;
                    }
                    const jarakOrder = this.hitungJarakKM(this.tokoAktif.lat, this.tokoAktif.lng, this.checkoutForm.lat, this.checkoutForm.lng);
                    if (jarakOrder > 2.0) {
                        this.showNotification('Pengantaran melebihi batas 2 KM!', 'error');
                        return;
                    }

                    const now = Date.now();
                    const orderData = {
                        id: now,
                        timestamp: now,
                        tanggal: new Date().toLocaleString('id-ID'),
                        customer: { ...this.checkoutForm },
                        items: this.keranjang,
                        totalBelanja: this.totalBelanja(),
                        ongkir: this.ongkir(),
                        totalTagihan: this.totalBelanja() + this.ongkir(),
                        status: 'Baru',
                        metode: 'transfer / qris (non-cod)',
                        chats: [
                            { sender: 'customer', text: 'Halo toko, saya telah membuat pesanan baru.', time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) }
                        ]
                    };

                    try {
                        await db.collection('kasirku_toko').doc(this.tokoAktif.kode).collection('transaksi').doc(String(now)).set(orderData);
                        this.lastOrderId = String(now);
                        this.dengarkanLiveChatSertaStatus(this.tokoAktif.kode, String(now));
                        alert('✅ Pesanan berhasil dikirim ke Toko ' + this.tokoAktif.nama + '!');
                        this.keranjang = [];
                        this.step = 'pilih_toko';
                    } catch (e) {
                        this.showNotification('Gagal kirim pesanan', 'error');
                    }
                },

                dengarkanLiveChatSertaStatus(kodeToko, orderId) {
                    db.collection('kasirku_toko').doc(kodeToko).collection('transaksi').doc(orderId).onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.chats) this.chatMessages = data.chats;
                        }
                    });
                },

                bukaLiveChatModal() {
                    if (!this.tokoAktif) {
                        this.showNotification('Pilih toko terlebih dahulu.', 'error');
                        return;
                    }
                    if (!this.chatMessages.length) {
                        this.chatMessages = [
                            { sender: 'customer', text: 'Halo toko, ada yang ingin saya tanyakan.', time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) }
                        ];
                    }
                    this.showChatModal = true;
                    this.$nextTick(() => { lucide.createIcons(); });
                },

                async kirimPesanChatCustomer() {
                    if (!this.inputChatText.trim()) return;
                    const msg = {
                        sender: 'customer',
                        text: this.inputChatText.trim(),
                        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                    };
                    this.chatMessages.push(msg);
                    this.inputChatText = '';

                    if (this.tokoAktif && this.lastOrderId) {
                        try {
                            await db.collection('kasirku_toko').doc(this.tokoAktif.kode).collection('transaksi').doc(this.lastOrderId).update({
                                chats: firebase.firestore.FieldValue.arrayUnion(msg)
                            });
                        } catch(e){}
                    }
                }
            }
        }
    </script>
</body>
</html>
